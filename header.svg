<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0c14"/>
      <stop offset="100%" style="stop-color:#13131f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4B5563"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="148" text-anchor="middle" font-size="58" font-weight="700" fill="#F9FAFB" letter-spacing="-1">Running Coach</text>

  <!-- Subtitle -->
  <text x="600" y="192" text-anchor="middle" font-size="17" fill="#6B7280" letter-spacing="3">STRAVA · CLAUDE · MCP · TELEGRAM</text>

  <!-- Divider -->
  <line x1="480" y1="218" x2="720" y2="218" stroke="#1F2937" stroke-width="1"/>

  <!-- Box 1: Telegram -->
  <rect x="100" y="295" width="190" height="90" rx="10" fill="#1e3a5f" fill-opacity="0.5" stroke="#2563EB" stroke-width="1.5"/>
  <text x="195" y="335" text-anchor="middle" font-size="19" font-weight="600" fill="#60A5FA">Telegram</text>
  <text x="195" y="362" text-anchor="middle" font-size="13" fill="#6B7280">You</text>

  <!-- Arrow 1 -->
  <line x1="292" y1="340" x2="368" y2="340" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 2: Python Backend -->
  <rect x="375" y="295" width="190" height="90" rx="10" fill="#064e3b" fill-opacity="0.5" stroke="#10B981" stroke-width="1.5"/>
  <text x="470" y="335" text-anchor="middle" font-size="19" font-weight="600" fill="#34D399">Python</text>
  <text x="470" y="362" text-anchor="middle" font-size="13" fill="#6B7280">Backend</text>

  <!-- Arrow 2 -->
  <line x1="567" y1="340" x2="643" y2="340" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 3: Claude -->
  <rect x="650" y="295" width="190" height="90" rx="10" fill="#3b1f6e" fill-opacity="0.5" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="745" y="335" text-anchor="middle" font-size="19" font-weight="600" fill="#A78BFA">Claude</text>
  <text x="745" y="362" text-anchor="middle" font-size="13" fill="#6B7280">Anthropic API</text>

  <!-- Arrow 3 -->
  <line x1="842" y1="340" x2="918" y2="340" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box 4: Strava MCP -->
  <rect x="925" y="295" width="190" height="90" rx="10" fill="#4a1500" fill-opacity="0.6" stroke="#FC4C02" stroke-width="1.5"/>
  <text x="1020" y="335" text-anchor="middle" font-size="19" font-weight="600" fill="#FC4C02">Strava</text>
  <text x="1020" y="362" text-anchor="middle" font-size="13" fill="#6B7280">MCP Server</text>

  <!-- Bottom tagline -->
  <text x="600" y="480" text-anchor="middle" font-size="15" fill="#374151">Data-driven coaching powered by your actual training history</text>
</svg>
